<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulador de Parquímetro</title>
  <link rel="stylesheet" href="meu.css">
  <script src="meu.js"></script>
  
</head>
<body>
  <h2>Simulador de Parquímetro</h2>

  <label for="valor">Insira o valor (R$):</label>

  <input type="number" step="0.01" id="valor" placeholder="Ex: 1.00" min="0" max="3">

  <button onclick="calcularTempo()">Simular</button>

  <p id="tempo"> </p>
  <p id="troco"> </p>

</body>
</html>
