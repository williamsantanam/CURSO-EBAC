<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulador de Parquímetro</title>
  <link rel="stylesheet" href="meu.css">
  <script src="meu.js"></script>
  
</head>
<body>
  <h2>Simulador de Parquímetro</h2>

  <label for="valor">Insira o valor (R$):</label><br>
  <input type="number" step="0.01" id="valor" placeholder="Ex: 2.50"><br>
  <button onclick="simular()">Simular</button>

  <div id="resultado"></div>

</body>
</html>
